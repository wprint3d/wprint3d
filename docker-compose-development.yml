services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    volumes:
      - .:/var/www:ro
      - ./proxy/nginxconfig.io:/etc/nginx/nginxconfig.io
      - ./proxy/backend-upstream-fastcgi-dev.conf:/etc/nginx/backend-upstream.conf:ro
      - ./proxy/internal:/etc/nginx/internal
      - ./proxy/conf.d:/etc/nginx/conf.d
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf
      - ./proxy/ssl:/etc/nginx/ssl
      - ./public:/public
      - ./storage/app/recordings:/public/recordings
      - ./internal/startup:/internal/startup:ro
      - /tmp/video:/tmp/video
    tmpfs:
      - /var/log/wprint3d:size=20m,mode=1777
    ports:
      - 80:80
      - 443:443
    depends_on:
      - web
      - backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    privileged: true
    environment:
      - ROLE=server,scheduler,concurrency-scheduler,ws-server
      - DEVELOPER_MODE=true
      - PHP_SERVER_DRIVER=fpm
      - COMPOSE_DIR=${PWD}
      - PLUGIN_DEVELOPMENT_MOUNT_PATH=/var/www/plugins-dev
      - QUEUES=default:1,recordings:1,broadcasts:2,prints:1,previews,snapshots
      - SLEEP=5
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --show-error --max-time 2 --output /dev/null http://127.0.0.1:6001"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    volumes:
      - .:/var/www
      - ${PWD}:${PWD}
      - ./internal/php-fpm-dev-www.conf:/usr/local/etc/php-fpm.d/zz-wprint3d-dev.conf:ro
      - ./examples/plugins:/var/www/plugins-dev
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases:
          - ws-server
    tmpfs:
      - /tmp
    depends_on:
      - redis
      - mongo
  web:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: development
    restart: always
    tty: true
    stdin_open: true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm/store
    ports:
      - ${WEB_HOST_PORT:-8081}:8081
    depends_on:
      - backend
      - redis
      - mongo
  mapper:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    privileged: true
    environment:
      - ROLE=mapper
      - PLUGIN_DEVELOPMENT_MOUNT_PATH=/var/www/plugins-dev
    volumes:
      - .:/var/www
      - ${PWD}:${PWD}
      - ./examples/plugins:/var/www/plugins-dev
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
    depends_on:
      - redis
      - mongo
  streamer:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - ROLE=streamer
      - PORT_SCAN_START=60000
      - PORT_SCAN_END=60016
      - YV_STREAMER_SOFTWARE_PORT=8080
      - PLUGIN_DEVELOPMENT_MOUNT_PATH=/var/www/plugins-dev
    privileged: true
    volumes:
      - .:/var/www
      - ${PWD}:${PWD}
      - ./examples/plugins:/var/www/plugins-dev
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/video:/tmp/video
    depends_on:
      - redis
      - mongo
      - proxy
      - mapper
      - yv-streamer-software
  yv-streamer-software:
    image: docker.io/wprint3d/yv-streamer-software:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - YV_STREAMER_SOFTWARE_HOST=0.0.0.0
      - YV_STREAMER_SOFTWARE_PORT=8080
      - YV_STREAMER_SOFTWARE_LOG_LEVEL=info
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
  redis:
    image: docker.io/library/redis:7.2.5
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    command: redis-server --save "" --appendonly no
  mongo:
    image: docker.io/library/mongo:4.4.6
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    command: mongod --quiet
    volumes:
      - mongo:/data/db
    ports:
      - ${MONGO_HOST_PORT:-27017}:27017
  memcached:
    image: docker.io/library/memcached:latest
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    restart: always
volumes:
  frontend_node_modules:
  frontend_pnpm_store:
  mongo:
