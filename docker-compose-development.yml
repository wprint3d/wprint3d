services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: always
    logging:
      driver: ${CONTAINER_LOG_DRIVER:-local}
      options:
        max-size: "1m"
        mode: non-blocking
    volumes:
      - ./proxy/nginxconfig.io:/etc/nginx/nginxconfig.io
      - ./proxy/internal:/etc/nginx/internal
      - ./proxy/conf.d:/etc/nginx/conf.d
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf
      - ./proxy/ssl:/etc/nginx/ssl
      - ./public:/public
      - ./storage/app/recordings:/public/recordings
      - ./internal/startup:/internal/startup:ro
      - /tmp/video:/tmp/video
    ports:
      - 80:80
      - 443:443
      - 6001:6001
    depends_on:
      - web
      - backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    logging:
      driver: ${CONTAINER_LOG_DRIVER:-local}
      options:
        max-size: "1m"
        mode: non-blocking
    privileged: true
    environment:
      - ROLE=server,scheduler,concurrency-scheduler,ws-server
      - DEVELOPER_MODE=true
      - COMPOSE_DIR=${PWD}
      - CONTAINER_CLI=${IN_CONTAINER_CLI:-docker}
      - CONTAINER_COMPOSE_COMMAND=${IN_CONTAINER_COMPOSE_COMMAND:-docker-compose}
      - PLUGIN_DEVELOPMENT_MOUNT_PATH=/var/www/plugins-dev
      - QUEUES=default:1,recordings:1,broadcasts:2,prints,previews,snapshots
      - SLEEP=5
    volumes:
      - .:/var/www
      - ${PWD}:${PWD}
      - ./examples/plugins:/var/www/plugins-dev
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - /proc:/proc
    tmpfs:
      - /tmp
    depends_on:
      - redis
      - mongo
  web:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    restart: always
    tty: true
    stdin_open: true
    volumes:
      - ./frontend:/app
    ports:
      - 8081:8081
    depends_on:
      - backend
      - redis
      - mongo
  mapper:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    logging:
      driver: ${CONTAINER_LOG_DRIVER:-local}
      options:
        max-size: "1m"
        mode: non-blocking
    privileged: true
    environment:
      - ROLE=mapper
      - PLUGIN_DEVELOPMENT_MOUNT_PATH=/var/www/plugins-dev
    volumes:
      - .:/var/www
      - ${PWD}:${PWD}
      - ./examples/plugins:/var/www/plugins-dev
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
    depends_on:
      - redis
      - mongo
  streamer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    logging:
      driver: ${CONTAINER_LOG_DRIVER:-local}
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - ROLE=streamer
      - PORT_SCAN_START=60000
      - PORT_SCAN_END=60016
      - YV_STREAMER_SOFTWARE_PORT=8080
      - PLUGIN_DEVELOPMENT_MOUNT_PATH=/var/www/plugins-dev
    privileged: true
    volumes:
      - .:/var/www
      - ${PWD}:${PWD}
      - ./examples/plugins:/var/www/plugins-dev
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - /tmp/video:/tmp/video
    depends_on:
      - redis
      - mongo
      - proxy
      - mapper
      - yv-streamer-software
  yv-streamer-software:
    image: docker.io/wprint3d/yv-streamer-software:latest
    restart: always
    logging:
      driver: ${CONTAINER_LOG_DRIVER:-local}
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - YV_STREAMER_SOFTWARE_HOST=0.0.0.0
      - YV_STREAMER_SOFTWARE_PORT=8080
      - YV_STREAMER_SOFTWARE_LOG_LEVEL=info
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
  redis:
    image: docker.io/library/redis:7.2.5
    restart: always
    logging:
      driver: ${CONTAINER_LOG_DRIVER:-local}
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    command: redis-server --save "" --appendonly no
  mongo:
    image: docker.io/library/mongo:4.4.6
    restart: always
    logging:
      driver: ${CONTAINER_LOG_DRIVER:-local}
      options:
        max-size: "1m"
        mode: non-blocking
    command: mongod --quiet
    volumes:
      - mongo:/data/db
    ports:
      - 27017:27017
  memcached:
    image: docker.io/library/memcached:latest
    logging:
      driver: ${CONTAINER_LOG_DRIVER:-local}
      options:
        max-size: "1m"
        mode: non-blocking
    restart: always
volumes:
  mongo:
