services:
  proxy:
    image: docker.io/wprint3d/wprint3d-proxy:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    volumes:
      - storage:/storage
      - proxy:/etc/nginx/internal
      - startup:/var/log/startup:ro
      - /tmp/video:/tmp/video
    ports:
      - ${EXTERNAL_WEB_HTTP_PORT:-80}:80
      - ${EXTERNAL_WEB_HTTPS_PORT:-443}:443
      - ${EXTERNAL_WEB_SOCKET_PORT:-6001}:6001
    depends_on:
      - web
      - ws-server
      - backend
  backend:
    image: docker.io/wprint3d/wprint3d:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    privileged: true
    environment:
      - ROLE=server
      - COMPOSE_DIR=${PWD}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
    tmpfs:
      - /tmp
    depends_on:
      - redis
      - mongo
  web:
    image: docker.io/wprint3d/wprint3d-frontend:latest
    restart: always
    tty: true
    stdin_open: true
    depends_on:
      - backend
      - redis
      - mongo
  scheduler:
    image: docker.io/wprint3d/wprint3d:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    privileged: true
    environment:
      - ROLE=scheduler
      - COMPOSE_DIR=${PWD}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
    depends_on:
      - redis
      - mongo
  mapper:
    image: docker.io/wprint3d/wprint3d:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    privileged: true
    environment:
      - ROLE=mapper
      - COMPOSE_DIR=${PWD}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
    depends_on:
      - redis
      - mongo
  concurrency-scheduler:
    image: docker.io/wprint3d/wprint3d:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    privileged: true
    environment:
      - ROLE=concurrency-scheduler
      - COMPOSE_DIR=${PWD}
      - QUEUES=default:1,recordings:1,broadcasts:2,prints,previews,snapshots # <queue-name>:<min-number-of-workers, default=0>
      - SLEEP=5
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
    depends_on:
      - redis
      - mongo
  ws-server:
    image: docker.io/wprint3d/wprint3d:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - ROLE=ws-server
      - COMPOSE_DIR=${PWD}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
    depends_on:
      - redis
      - mongo
  streamer:
    image: docker.io/wprint3d/wprint3d:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - ROLE=streamer
      - COMPOSE_DIR=${PWD}
      - PORT_SCAN_START=60000
      - PORT_SCAN_END=60016
      - YV_STREAMER_SOFTWARE_PORT=8080
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
      - /tmp/video:/tmp/video
    depends_on:
      - redis
      - mongo
      - proxy
      - mapper
      - yv-streamer-software
  yv-streamer-software:
    image: docker.io/wprint3d/yv-streamer-software:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - YV_STREAMER_SOFTWARE_HOST=0.0.0.0
      - YV_STREAMER_SOFTWARE_PORT=8080
      - YV_STREAMER_SOFTWARE_LOG_LEVEL=info
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
  redis:
    image: docker.io/library/redis:7.2.5
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    command: redis-server --save "" --appendonly no
  mongo:
    image: docker.io/library/mongo:4.4.6
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
    command: mongod --quiet
    volumes:
      - mongo:/data/db
  memcached:
    image: docker.io/library/memcached:latest
    restart: always
    logging:
      driver: local
      options:
        max-size: "1m"
        mode: non-blocking
volumes:
  mongo:
  storage:
  proxy:
  startup:
