services:
  proxy:
    image: docker.io/wprint3d/wprint3d-proxy:latest
    restart: always
    logging:
      driver: none
    volumes:
      - storage:/storage
      - proxy:/etc/nginx/internal
      - startup:/var/log/startup:ro
      - /tmp/video:/tmp/video
    tmpfs:
      - /var/log/wprint3d:size=20m,mode=1777
    ports:
      - ${EXTERNAL_WEB_HTTP_PORT:-80}:80
      - ${EXTERNAL_WEB_HTTPS_PORT:-443}:443
    depends_on:
      - web
      - backend
  backend:
    image: docker.io/wprint3d/wprint3d:latest
    restart: always
    logging:
      driver: none
    privileged: true
    environment:
      - ROLE=server,scheduler,concurrency-scheduler,ws-server
      - COMPOSE_DIR=${PWD}
      - QUEUES=default:1,recordings:1,broadcasts:2,prints:1,previews,snapshots
      - SLEEP=5
      - WPRINT3D_RUNTIME_LOG_DIR=/var/log/wprint3d
      - WPRINT3D_LOG_DIR=/var/log/wprint3d/app
      - WPRINT3D_FORCE_RAMDISK=${WPRINT3D_FORCE_RAMDISK:-auto}
      - LOG_LEVEL=${WPRINT3D_LOG_LEVEL:-warning}
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --show-error --max-time 2 --output /dev/null http://127.0.0.1:6001"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
    networks:
      default:
        aliases:
          - ws-server
    tmpfs:
      - /tmp
      - /var/log/wprint3d:size=20m,mode=1777
    depends_on:
      - redis
      - mongo
  web:
    image: docker.io/wprint3d/wprint3d-frontend:latest
    restart: always
    logging:
      driver: none
    tty: true
    stdin_open: true
    depends_on:
      - backend
      - redis
      - mongo
  mapper:
    image: docker.io/wprint3d/wprint3d-mapper:latest
    restart: always
    logging:
      driver: none
    privileged: true
    environment:
      - ROLE=mapper
      - COMPOSE_DIR=${PWD}
      - WPRINT3D_RUNTIME_LOG_DIR=/var/log/wprint3d
      - WPRINT3D_LOG_DIR=/var/log/wprint3d/app
      - WPRINT3D_FORCE_RAMDISK=${WPRINT3D_FORCE_RAMDISK:-auto}
      - LOG_LEVEL=${WPRINT3D_LOG_LEVEL:-warning}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
    tmpfs:
      - /var/log/wprint3d:size=20m,mode=1777
    depends_on:
      - redis
      - mongo
  streamer:
    image: docker.io/wprint3d/wprint3d-streamer:latest
    restart: always
    logging:
      driver: none
    environment:
      - ROLE=streamer
      - COMPOSE_DIR=${PWD}
      - PORT_SCAN_START=60000
      - PORT_SCAN_END=60016
      - YV_STREAMER_SOFTWARE_PORT=8080
      - WPRINT3D_RUNTIME_LOG_DIR=/var/log/wprint3d
      - WPRINT3D_LOG_DIR=/var/log/wprint3d/app
      - WPRINT3D_FORCE_RAMDISK=${WPRINT3D_FORCE_RAMDISK:-auto}
      - LOG_LEVEL=${WPRINT3D_LOG_LEVEL:-warning}
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - storage:/var/www/storage
      - proxy:/var/www/proxy/internal
      - startup:/var/www/internal/startup
      - ./wprint3d-config:/var/www/.external-configs
      - ${PWD}:${PWD}
      - /tmp/video:/tmp/video
    tmpfs:
      - /var/log/wprint3d:size=20m,mode=1777
    depends_on:
      - redis
      - mongo
      - proxy
      - mapper
      - yv-streamer-software
  yv-streamer-software:
    image: docker.io/wprint3d/yv-streamer-software:latest
    restart: always
    logging:
      driver: none
    environment:
      - YV_STREAMER_SOFTWARE_HOST=0.0.0.0
      - YV_STREAMER_SOFTWARE_PORT=8080
      - YV_STREAMER_SOFTWARE_LOG_LEVEL=warn
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /sys/class:/sys/class
      - /sys/devices:/sys/devices
      - /run/udev:/run/udev:ro
  redis:
    image: docker.io/library/redis:7.2.5
    restart: always
    logging:
      driver: none
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    command: redis-server --save "" --appendonly no --loglevel warning
  mongo:
    image: docker.io/library/mongo:4.4.6
    restart: always
    logging:
      driver: none
    command: mongod --quiet
    volumes:
      - mongo:/data/db
  memcached:
    image: docker.io/library/memcached:latest
    restart: always
    logging:
      driver: none
volumes:
  mongo:
  storage:
  proxy:
  startup:
