name: Docker Image CI

on:
  push:
    branches: [ "alpha" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      -
        name: Build and push main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wprint3d:latest
          cache-from: type=s3,region=${{ secrets.S3_REGION }},endpoint_url=${{ secrets.S3_ENDPOINT }},access_key_id=${{ secrets.S3_ACCESS_KEY_ID }},secret_access_key=${{ secrets.S3_SECRET_ACCESS_KEY }},bucket=actions-cache,mode=max
          cache-to: type=s3,region=${{ secrets.S3_REGION }},endpoint_url=${{ secrets.S3_ENDPOINT }},access_key_id=${{ secrets.S3_ACCESS_KEY_ID }},secret_access_key=${{ secrets.S3_SECRET_ACCESS_KEY }},bucket=actions-cache,mode=max
      -
        name: Build and push the proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wprint3d-proxy:latest
          cache-from: type=s3,region=${{ secrets.S3_REGION }},endpoint_url=${{ secrets.S3_ENDPOINT }},access_key_id=${{ secrets.PROXY_S3_ACCESS_KEY_ID }},secret_access_key=${{ secrets.PROXY_S3_SECRET_ACCESS_KEY }},bucket=actions-cache-proxy,mode=max
          cache-to: type=s3,region=${{ secrets.S3_REGION }},endpoint_url=${{ secrets.S3_ENDPOINT }},access_key_id=${{ secrets.PROXY_S3_ACCESS_KEY_ID }},secret_access_key=${{ secrets.PROXY_S3_SECRET_ACCESS_KEY }},bucket=actions-cache-proxy,mode=max