name: Docker Image CI

on:
  push:
    branches: [ "alpha" ]
  pull_request:
    branches: [ "alpha" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-22.04
    steps:
      -
        name: Restore from cache
        uses: tespkg/actions-cache/restore@v1
        with:
          endpoint: ${{ secrets.S3_ENDPOINT }}
          accessKey: ${{ secrets.S3_ACCESS_KEY_ID }}
          secretKey: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          region: ${{ secrets.S3_REGION }}
          bucket: actions-cache
          key: ${{ runner.os }}
          path: |
            /var/lib/docker
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      -
        name: Build and push main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wprint3d:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      -
        name: Build and push the proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wprint3d-proxy:latest
      -
        name: Save to cache
        uses: tespkg/actions-cache/save@v1
        with:
          endpoint: ${{ secrets.S3_ENDPOINT }}
          accessKey: ${{ secrets.S3_ACCESS_KEY_ID }}
          secretKey: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          region: ${{ secrets.S3_REGION }}
          bucket: actions-cache
          key: ${{ runner.os }}
          path: |
            /var/lib/docker