name: Docker Image CI

on:
  push:
    branches: ["pre-alpha", "alpha", "beta", "master"]
  pull_request:
    branches: ["pre-alpha", "alpha", "beta", "master"]
  workflow_dispatch:
    inputs:
      cura_w3dp_url:
        description: HTTPS URL of the exact signed Cura W3DP archive
        required: true
        type: string
      cura_w3dp_sha256:
        description: SHA-256 of the signed Cura W3DP archive
        required: true
        type: string
      cura_plugin_version:
        description: Expected signed Cura plugin version
        required: true
        type: string
      cura_compatibility_url:
        description: HTTPS URL of the matching Cura compatibility record
        required: true
        type: string
      cura_compatibility_sha256:
        description: SHA-256 of the matching compatibility record
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io/wprint3d

jobs:
  validate:
    name: Validate Docker configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Validate Bake and Compose configuration
        run: |
          docker buildx bake --print production > /dev/null
          docker compose config --quiet
          docker compose -f docker-compose-development.yml config --quiet

      - name: Run Docker configuration tests
        run: |
          for test_file in tests/Unit/*docker*.sh tests/Unit/*compose*.sh tests/Unit/dev-fpm-runtime-test.sh tests/Unit/third-party-licenses-generation-test.sh; do
            if [[ "$test_file" == *docker-image-smoke-test.sh ]]; then
              continue
            fi
            bash "$test_file"
          done
          bash tests/Unit/cura-cross-app-e2e-harness-test.sh

  pull-request-build:
    name: PR validation build (amd64)
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Record build start
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and load production images
        uses: docker/bake-action@v6
        env:
          PLATFORM: linux/amd64
          TAG: pr-${{ github.event.pull_request.number }}
          VCS_REF: ${{ github.sha }}
        with:
          targets: production
          set: |
            *.output=type=docker
            backend.cache-from=type=gha,scope=backend-amd64
            backend.cache-to=type=gha,mode=max,scope=backend-amd64
            mapper.cache-from=type=gha,scope=mapper-amd64
            mapper.cache-to=type=gha,mode=max,scope=mapper-amd64
            streamer.cache-from=type=gha,scope=streamer-amd64
            streamer.cache-to=type=gha,mode=max,scope=streamer-amd64
            proxy.cache-from=type=gha,scope=proxy-amd64
            proxy.cache-to=type=gha,mode=max,scope=proxy-amd64
            frontend.cache-from=type=gha,scope=frontend-amd64
            frontend.cache-to=type=gha,mode=max,scope=frontend-amd64

      - name: Verify code-only cache reuse
        env:
          PLATFORM: linux/amd64
          TAG: pr-${{ github.event.pull_request.number }}
          VCS_REF: ${{ github.sha }}
        run: |
          probe=app/.docker-cache-probe
          trap 'rm -f "$probe"' EXIT
          printf '%s\n' "$GITHUB_SHA" > "$probe"
          cache_started=$(date +%s)
          docker buildx bake production --set '*.output=type=cacheonly'
          echo "CACHE_BUILD_DURATION=$(($(date +%s) - cache_started))" >> "$GITHUB_ENV"

      - name: Smoke test images
        env:
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
        run: bash tests/Unit/docker-image-smoke-test.sh

      - name: Report image sizes and duration
        continue-on-error: true
        env:
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          duration=$(($(date +%s) - BUILD_STARTED))
          {
            echo '### Docker image report (linux/amd64)'
            echo
            echo '| Image | Compressed size |'
            echo '| --- | ---: |'
            total_bytes=0
            for image in wprint3d wprint3d-mapper wprint3d-streamer wprint3d-proxy wprint3d-frontend; do
              bytes=$(docker image save "$REGISTRY/$image:$IMAGE_TAG" | gzip -1 | wc -c)
              total_bytes=$((total_bytes + bytes))
              echo "| $image | $(numfmt --to=iec-i --suffix=B "$bytes") |"
            done
            echo "| **Total** | **$(numfmt --to=iec-i --suffix=B "$total_bytes")** |"
            echo
            echo "Build duration: ${duration}s"
            echo
            echo "Code-only cache verification duration: ${CACHE_BUILD_DURATION}s"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-cura-builtin:
    name: Prepare signed Cura built-in
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,dom,fileinfo,intl,mbstring,mongodb,pcntl,pdo,pdo_mysql,redis,zip
          tools: composer:v2

      - name: Install WPrint verification dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Download and verify signed Cura artifacts
        env:
          CURA_RELEASE_READ_TOKEN: ${{ secrets.CURA_RELEASE_READ_TOKEN }}
          CURA_W3DP_URL: ${{ inputs.cura_w3dp_url }}
          CURA_W3DP_SHA256: ${{ inputs.cura_w3dp_sha256 }}
          CURA_COMPATIBILITY_URL: ${{ inputs.cura_compatibility_url }}
          CURA_COMPATIBILITY_SHA256: ${{ inputs.cura_compatibility_sha256 }}
        run: |
          set -euo pipefail
          [[ -n "$CURA_RELEASE_READ_TOKEN" ]] || { echo 'CURA_RELEASE_READ_TOKEN is required.' >&2; exit 1; }
          [[ "$CURA_W3DP_URL" == https://* ]] || { echo 'Cura W3DP URL must use HTTPS.' >&2; exit 1; }
          [[ "$CURA_COMPATIBILITY_URL" == https://* ]] || { echo 'Cura compatibility URL must use HTTPS.' >&2; exit 1; }
          [[ "$CURA_W3DP_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'Invalid Cura W3DP SHA-256.' >&2; exit 1; }
          [[ "$CURA_COMPATIBILITY_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo 'Invalid Cura compatibility SHA-256.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/cura-builtin"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --header 'Accept: application/octet-stream' \
            --header "Authorization: Bearer $CURA_RELEASE_READ_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$CURA_W3DP_URL" -o "$RUNNER_TEMP/cura-builtin/cura-web-ui.w3dp"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --header 'Accept: application/octet-stream' \
            --header "Authorization: Bearer $CURA_RELEASE_READ_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$CURA_COMPATIBILITY_URL" -o "$RUNNER_TEMP/cura-builtin/compatibility.json"
          printf '%s  %s\n' "${CURA_W3DP_SHA256,,}" "$RUNNER_TEMP/cura-builtin/cura-web-ui.w3dp" | sha256sum --check --status
          printf '%s  %s\n' "${CURA_COMPATIBILITY_SHA256,,}" "$RUNNER_TEMP/cura-builtin/compatibility.json" | sha256sum --check --status

      - name: Stage and verify the trusted built-in
        env:
          CURA_W3DP_SIGNER_PUBLIC_KEY: ${{ secrets.CURA_W3DP_SIGNER_PUBLIC_KEY }}
          PLUGIN_VERSION: ${{ inputs.cura_plugin_version }}
          PLUGIN_TRUSTED_PUBLIC_KEYS: ${{ runner.temp }}/cura-builtin/signer-public.pem
        run: |
          set -euo pipefail
          [[ -n "$CURA_W3DP_SIGNER_PUBLIC_KEY" ]] || { echo 'CURA_W3DP_SIGNER_PUBLIC_KEY is required.' >&2; exit 1; }
          printf '%s\n' "$CURA_W3DP_SIGNER_PUBLIC_KEY" > "$RUNNER_TEMP/cura-builtin/signer-public.pem"
          chmod 600 "$RUNNER_TEMP/cura-builtin/signer-public.pem"
          archive_sha256="$(sha256sum "$RUNNER_TEMP/cura-builtin/cura-web-ui.w3dp" | awk '{print tolower($1)}')"
          scripts/stage-builtin-plugin.sh \
            --archive "$RUNNER_TEMP/cura-builtin/cura-web-ui.w3dp" \
            --expected-plugin-id cura-web-ui \
            --expected-version "$PLUGIN_VERSION" \
            --expected-sha256 "$archive_sha256" \
            --destination "resources/plugins/builtin/archives/cura-web-ui-${PLUGIN_VERSION}.w3dp" \
            --inventory resources/plugins/builtin/index.json \
            --compatibility-record "$RUNNER_TEMP/cura-builtin/compatibility.json"
          php artisan plugin:verify-builtins

      - name: Upload staged built-in payload
        uses: actions/upload-artifact@v4
        with:
          name: cura-builtin-staged
          if-no-files-found: error
          path: resources/plugins/builtin

  architecture-build:
    name: Build and push (${{ matrix.arch }})
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.prepare-cura-builtin.result == 'success' || needs.prepare-cura-builtin.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, prepare-cura-builtin]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download staged Cura built-in
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: cura-builtin-staged
          path: resources/plugins/builtin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record build start
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and push architecture images
        uses: docker/bake-action@v6
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.sha }}
          TAG_SUFFIX: -${{ matrix.arch }}
          VCS_REF: ${{ github.sha }}
        with:
          targets: production
          push: true
          set: |
            backend.cache-from=type=gha,scope=backend-${{ matrix.arch }}
            backend.cache-to=type=gha,mode=max,scope=backend-${{ matrix.arch }}
            mapper.cache-from=type=gha,scope=mapper-${{ matrix.arch }}
            mapper.cache-to=type=gha,mode=max,scope=mapper-${{ matrix.arch }}
            streamer.cache-from=type=gha,scope=streamer-${{ matrix.arch }}
            streamer.cache-to=type=gha,mode=max,scope=streamer-${{ matrix.arch }}
            proxy.cache-from=type=gha,scope=proxy-${{ matrix.arch }}
            proxy.cache-to=type=gha,mode=max,scope=proxy-${{ matrix.arch }}
            frontend.cache-from=type=gha,scope=frontend-${{ matrix.arch }}
            frontend.cache-to=type=gha,mode=max,scope=frontend-${{ matrix.arch }}

      - name: Verify code-only cache reuse
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ github.sha }}
          TAG_SUFFIX: -${{ matrix.arch }}
          VCS_REF: ${{ github.sha }}
        run: |
          probe=app/.docker-cache-probe
          trap 'rm -f "$probe"' EXIT
          printf '%s\n' "$GITHUB_SHA" > "$probe"
          cache_started=$(date +%s)
          docker buildx bake production --set '*.output=type=cacheonly'
          echo "CACHE_BUILD_DURATION=$(($(date +%s) - cache_started))" >> "$GITHUB_ENV"

      - name: Smoke test published images
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
        run: |
          for image in wprint3d wprint3d-mapper wprint3d-streamer wprint3d-proxy wprint3d-frontend; do
            docker pull "$REGISTRY/$image:$IMAGE_TAG"
          done
          bash tests/Unit/docker-image-smoke-test.sh

      - name: Report compressed image sizes and duration
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          duration=$(($(date +%s) - BUILD_STARTED))
          {
            echo '### Docker image report (${{ matrix.platform }})'
            echo
            echo '| Image | Compressed size |'
            echo '| --- | ---: |'
            total_bytes=0
            for image in wprint3d wprint3d-mapper wprint3d-streamer wprint3d-proxy wprint3d-frontend; do
              reference="$REGISTRY/$image:$IMAGE_TAG"
              manifest=$(docker buildx imagetools inspect --raw "$reference")
              digest=$(jq -r --arg arch "$IMAGE_ARCH" \
                '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest][0] // empty' \
                <<< "$manifest")
              if [[ -n "$digest" ]]; then
                manifest=$(docker buildx imagetools inspect --raw "$REGISTRY/$image@$digest")
              fi
              bytes=$(jq -er '[.layers[]?.size] | add // 0' <<< "$manifest")
              total_bytes=$((total_bytes + bytes))
              echo "| $image | $(numfmt --to=iec-i --suffix=B "$bytes") |"
            done
            echo "| **Total** | **$(numfmt --to=iec-i --suffix=B "$total_bytes")** |"
            echo
            echo "Build duration: ${duration}s"
            echo
            echo "Code-only cache verification duration: ${CACHE_BUILD_DURATION}s"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-manifests:
    name: Publish multi-architecture manifests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: architecture-build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create commit manifests
        run: |
          for image in wprint3d wprint3d-mapper wprint3d-streamer wprint3d-proxy wprint3d-frontend; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$image:${GITHUB_SHA}" \
              "$REGISTRY/$image:${GITHUB_SHA}-amd64" \
              "$REGISTRY/$image:${GITHUB_SHA}-arm64"
          done

      - name: Promote release manifests
        run: |
          for image in wprint3d-mapper wprint3d-streamer wprint3d-proxy wprint3d-frontend wprint3d; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$image:latest" \
              "$REGISTRY/$image:${GITHUB_SHA}"
          done
