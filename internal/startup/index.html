            text-align: center;

        #statusContainer { width: 100vw; }

        /* See https://stackoverflow.com/a/6410923 */
        @-webkit-keyframes rotating {
            from { -webkit-transform: rotate(0deg);   }
            to   { -webkit-transform: rotate(360deg); }
        }

        .rotating {
            width: 4vw;
            -webkit-animation: rotating 2.5s linear infinite;
        }

        #iframeContainer {
            border: 1px solid #c8c8c8;
            border-radius: .5rem;
            background-color: #fff;
            position: relative;
            left: 1%;
            width: 96%;
            padding: .5em;
        }

        #iframeContainer p {
            padding-bottom: .5em;
            margin: 0;
        }

        details {
            display: flex;
            flex-direction: column;
            width: 100%;
            position: absolute;
            left: 0;
        }

        #startupLogContainer {
            display: flex;
            flex: 1;
            justify-content: center;
        }

        #startupLog {
            background-color: #f8f9fa;
            border: 1px solid #d4d4d4;
            width: 97.5%;
            max-width: 1024px;
            height: 37.5vh;
            text-align: left;
            overflow: scroll;
            justify-self: center;
        }

        .dot {
            height: 1.1em;
            width: 1.1em;
            background-color: #c8c8c8;
            border-radius: 50%;
            margin-right: .25em;
        }

        .dot-waiting  { background-color: #e60000; }
        .dot-starting { background-color: #ffcc00; }
        .dot-success  { background-color: #00cc00; }

        .status-item {
            display: flex;
            align-items: center;
            margin: .5em;
        }

        pre { margin: .75em; }

        @media (prefers-color-scheme: dark) {
            #startupLog {
                background-color: black;
                border-color: #454545;
            }

            body {
                background-color: black;

                color: #dfdfdf;
            }

            #iframeContainer {
                border-color: #454545;
                background-color: #262626;
            }
        }

    </style>
</head>
<body>

    <div id="statusContainer">
        <svg class="rotating" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 16 16">
            <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
        </svg>

        <h2> WPrint 3D </h2>

        <p>
            We're still getting some work done in order to get everything up and running. <br>
            <br>
            This page will keep updating with the status for each service and their startup logs until we're good to go.
        </p>

        <p>
            <div style="display: flex; justify-content: center;">
                <div id="services">
                    <!-- This will be replaced with the services -->
                    <small> Waiting for services list... </small>
                </div>
            </div>
        </p>

        <p>
            <details>
                <summary> Last 10 lines of the startup log for each service. </summary>
                <div id="startupLogContainer">
                    <p id="startupLog">
                        <!-- This will be replaced with the startup log -->
                    </p>
                </div>
            </details>
        </p>
    </div>

    <script>
        let isFetching      = false,
            firstFetch      = true,
            isGettingStatus = false,
            services        = [];

        const displayName = {
            'proxy':                    'Proxy',
            'web':                      'Web UI',
            'streamer':                 'Camera streamer',
            'mapper':                   'Device mapper',
            'backend':                  'Backend API and WebSocket server',
            'scheduler':                'Task scheduler',
            'concurrency-scheduler':    'Concurrency tasks scheduler',
            'queue':                    'Queue workers manager',
            'documentation-generator':  'Documentation generator',
            'mongo':                    'Persistent database',
            'redis':                    'Redis-compatible cache',
            'memcached':                'Memcached fast cache'
        };

        const fetchStartupLog = async () => {
            let container = document.getElementById('startupLog');

            if (firstFetch) {
                firstFetch = false;

                container.innerHTML = '<pre>Downloading startup log...</pre>';
            }

            if (isFetching) return;

            isFetching = true;

            let status = null;

            fetch('startup.txt')
                .then(response => {
                    if (response.status === 502) {
                        status = response.status;

                        return;
                    }

                    const contentType = response.headers.get('content-type');

                    if (!contentType || !contentType.includes('text/plain')) {
                        window.location.href = '/';

                        return;
                    }

                    return response.text();
                })
                .then(data => {
                    if (status === 502) {
                        container.innerHTML = '<pre>Waiting for data...</pre>';

                        return;
                    }

                    const text = data ?? 'Startup completed!';

                    container.innerHTML = `<pre>${text}</pre>`;

                    container.scrollTop = container.scrollHeight;
                })
                .finally(() => { isFetching = false; }); 
        }

        const fetchServicesList = async () => {
            fetch('services.txt')
                .then(response => {
                    if (response.status === 502) {
                        console.error('Gateway timeout. Please wait...');

                        return;
                    }

                    return response.text();
                })
                .then(data => {
                    if (!data) {
                        console.error('No services found.');

                        return;
                    }

                    services = data.split('\n').filter(service => service.length > 0);

                    console.log('services:', services);

                    const servicesContainer = document.getElementById('services');

                    servicesContainer.innerHTML = '';

                    services.forEach(service => {
                        let simplifiedName = service.substring(0, service.lastIndexOf('-')).replace('wprint3d-', '');

                        servicesContainer.innerHTML += `
                            <div class="status-item" data-internal-name="${service}">
                                <div class="dot dot-waiting"></div>
                                <div style="align-content: center;">
                                    ${displayName[simplifiedName] ?? simplifiedName}
                                    - <strong class="status">waiting for status...</strong>
                                </div>
                            </div>
                        `;
                    });
                });
        }

        const refreshServicesStatus = async () => {
            if (isGettingStatus || !services.length) return;

            isGettingStatus = true;

            services.forEach(service => {
                const container = document.querySelector(`div[data-internal-name="${service}"]`);

                if (!container) {
                    console.error(`Service ${service} not found in the DOM.`);

                    return;
                }

                const dot    = container.querySelector('.dot'),
                      status = container.querySelector('.status');

                if (!dot) {
                    console.error(`Service ${service} does not have a dot element.`);

                    return;
                }

                if (!status) {
                    console.error(`Service ${service} does not have a status element.`);

                    return;
                }

                fetch(`${service}_status.txt`)
                    .then(response => response.text())
                    .then(data => {
                        isGettingStatus = false;

                        dot.classList.remove('dot-waiting');
                        dot.classList.add(data.includes('1') ? 'dot-success' : 'dot-starting');

                        status.innerHTML = data.includes('1') ? 'running' : 'starting...';
                    });
            });
        }

        setInterval(() => {
            fetchStartupLog();

            if (services.length === 0) {
                fetchServicesList();
            }

            refreshServicesStatus();
        }, 1500);
    </script>

</body>
</html>
