proxy_http_version                 1.1;
proxy_cache_bypass                 $http_upgrade;
client_max_body_size               0;
proxy_request_buffering            off;
proxy_max_temp_file_size           0;

# Proxy SSL
proxy_ssl_server_name              on;

# Proxy headers
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Forwarded         $proxy_add_forwarded;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Proxy connection timeouts
# Keep unavailable upstreams fail-fast. Response timeouts are route-specific:
# the development frontend may legitimately spend several minutes compiling
# its first bundle, while backend requests should fail much sooner.
proxy_connect_timeout              5s;
proxy_send_timeout                 30s;
